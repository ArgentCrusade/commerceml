name: run-tests

on: [push, pull_request]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                laravel: ['10', '11', '12', '13']

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

        steps:
            - name: Checkout code
              id: checkout-code
              uses: actions/checkout@v6

            - name: Setup PHP
              id: setup-php
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, xmlreader, xmlwriter
                  coverage: none
                  tools: composer:v2

            - name: Get Composer Cache Directory
              id: get-composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Setup Cache
              id: setup-cache
              uses: actions/cache@v5
              with:
                  path: ${{ steps.get-composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json', 'composer.lock') }}

            - name: Validate Composer configuration
              run: composer validate --strict

            - name: Install dependencies
              id: install-deps
              run: composer update --with "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --prefer-dist --no-progress

            - name: Run tests
              id: run-tests
              run: vendor/bin/phpunit
